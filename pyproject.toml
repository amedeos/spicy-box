[project]
name = "spicy-box"
version = "0.1.0"
description = "Parametric carousel holder for spice tubes, modelled in build123d"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "build123d==0.11.1",
]

[project.optional-dependencies]
# Shaded PNG previews. Kept optional because the geometry, the exports and the
# tests all work without a plotting stack.
preview = ["matplotlib>=3.8", "numpy>=1.26"]

[project.scripts]
spicy-box-export = "spicy_box.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spicy_box"]

[tool.pytest.ini_options]
testpaths = ["tests"]
